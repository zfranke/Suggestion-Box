version: "3.9"

services:
  suggestion-db:
    image: suggestion-box-db
    container_name: suggestion-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"

  suggestions-backend:
    image: suggestion-box-backend
    container_name: suggestions-backend
    depends_on:
      - suggestion-db
    environment:
      DB_HOST: suggestion-db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5055
    ports:
      - "5055:5055"


  suggestions-frontend:
    image: suggestion-box-frontend
    container_name: suggestions-frontend
    ports:
      - '5054:5054'
    depends_on:
      - suggestions-backend
    networks:
      - suggestions-network
    environment:
      - REACT_APP_BACKEND_URL=http://suggestions-backend.zfserver.lan:5055
      - REACT_APP_FRONTEND_URL=http://suggestions.zfserver.lan
      - PORT=5054
    expose:
      - "5054"

networks:
   suggestions-network:
    external: true